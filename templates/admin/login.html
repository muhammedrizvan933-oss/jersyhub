<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | JerseyHub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-body d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        
        <div class="card bg-dark border-secondary border-opacity-25 rounded-4 p-4 p-md-5 shadow-lg">
          
          <div class="text-center mb-4">
            <div class="mx-auto rounded-circle bg-success bg-opacity-10 text-success d-flex align-items-center justify-content-center display-5 mb-3" style="width: 70px; height: 70px; border: 2px solid #00e676;">
              <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h4 class="fw-bold text-white mb-1">Admin Portal</h4>
            <span class="text-muted small">JerseyHub DBMS Management System</span>
          </div>

          <!-- Flash Messages -->
          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, message in messages %}
                <div class="alert alert-{{ category if category != 'error' else 'danger' }} small py-2 mb-3">
                  {{ message }}
                </div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form action="{{ url_for('admin.login') }}" method="POST">
            <div class="mb-3">
              <label class="form-label small text-muted text-uppercase fw-bold">Admin Username / Email</label>
              <div class="input-group">
                <span class="input-group-text bg-secondary bg-opacity-25 border-secondary text-muted"><i class="bi bi-person-badge"></i></span>
                <input type="text" name="identifier" class="form-control" placeholder="Username or email" required autofocus>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label small text-muted text-uppercase fw-bold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-secondary bg-opacity-25 border-secondary text-muted"><i class="bi bi-key"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Password" required>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-bold fs-6 mb-3">
              <i class="bi bi-box-arrow-in-right me-1"></i> Access Admin Console
            </button>
          </form>

          <div class="text-center pt-3 border-top border-secondary border-opacity-25">
            <a href="{{ url_for('main.home') }}" class="text-muted small text-decoration-none">
              <i class="bi bi-arrow-left me-1"></i> Back to Public Store
            </a>
          </div>

        </div>

      </div>
    </div>
  </div>

</body>
</html>
