{% extends 'base.html' %}

{% block title %}Create Account | JerseyHub{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      
      <div class="card bg-dark border-secondary border-opacity-25 rounded-4 p-4 p-md-5 shadow-lg">
        
        <div class="text-center mb-4">
          <div class="brand-logo justify-content-center mb-2">
            <i class="bi bi-shield-fill-check text-success"></i>
            <span>Jersey<span style="color: #00e676;">Hub</span></span>
          </div>
          <h4 class="fw-bold text-white mb-1">Join JerseyHub</h4>
          <p class="text-muted small">Create an account for expedited checkout and live shipment tracking.</p>
        </div>

        <form action="{{ url_for('auth.register', next=request.args.get('next')) }}" method="POST">
          <div class="row g-3">
            
            <div class="col-md-6">
              <label class="form-label">Username *</label>
              <input type="text" name="username" class="form-control" placeholder="ronaldo7" required autofocus>
            </div>

            <div class="col-md-6">
              <label class="form-label">Email Address *</label>
              <input type="email" name="email" class="form-control" placeholder="cr7@example.com" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" name="full_name" class="form-control" placeholder="Cristiano Ronaldo">
            </div>

            <div class="col-md-6">
              <label class="form-label">Phone Number</label>
              <input type="tel" name="phone" class="form-control" placeholder="+1 (555) 000-0000">
            </div>

            <div class="col-md-6">
              <label class="form-label">Password *</label>
              <input type="password" name="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Confirm Password *</label>
              <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" minlength="6" required>
            </div>

            <div class="col-12 mt-4">
              <button type="submit" class="btn btn-jh-primary w-100 py-2 fs-6 mb-3">
                <i class="bi bi-person-check-fill me-1"></i> Create Customer Account
              </button>
            </div>
          </div>
        </form>

        <div class="text-center text-muted small pt-3 border-top border-secondary border-opacity-25">
          Already have an account? <a href="{{ url_for('auth.login', next=request.args.get('next')) }}" class="text-success fw-bold text-decoration-none">Log In</a>
        </div>

      </div>

    </div>
  </div>
</div>
{% endblock %}
