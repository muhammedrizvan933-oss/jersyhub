{% extends 'base.html' %}

{% block title %}Log In | JerseyHub{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      
      <div class="card bg-dark border-secondary border-opacity-25 rounded-4 p-4 p-md-5 shadow-lg">
        
        <div class="text-center mb-4">
          <div class="brand-logo justify-content-center mb-2">
            <i class="bi bi-shield-fill-check text-success"></i>
            <span>Jersey<span style="color: #00e676;">Hub</span></span>
          </div>
          <h4 class="fw-bold text-white mb-1">Welcome Back!</h4>
          <p class="text-muted small">Log in to manage your orders, wishlist, and profile.</p>
        </div>

        <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
          <div class="mb-3">
            <label class="form-label">Username or Email</label>
            <div class="input-group">
              <span class="input-group-text bg-secondary bg-opacity-25 border-secondary text-muted"><i class="bi bi-person"></i></span>
              <input type="text" name="identifier" class="form-control" placeholder="Username or email" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-secondary bg-opacity-25 border-secondary text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="remember" id="rememberMe">
              <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
            </div>
            <a href="#" class="text-success small text-decoration-none">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-jh-primary w-100 py-2 fs-6 mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Log In to JerseyHub
          </button>
        </form>

        <div class="text-center text-muted small pt-3 border-top border-secondary border-opacity-25">
          Don't have an account? <a href="{{ url_for('auth.register', next=request.args.get('next')) }}" class="text-success fw-bold text-decoration-none">Sign Up</a>
        </div>

      </div>

    </div>
  </div>
</div>
{% endblock %}
