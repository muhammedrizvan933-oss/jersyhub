databases:
  - name: jerseyhub-db
    databaseName: jerseyhub
    user: jerseyhub
    plan: free

services:
  - type: web
    name: jerseyhub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: jerseyhub-db
          property: connectionString
